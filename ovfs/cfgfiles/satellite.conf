<?xml version="1.0" encoding="utf-8"?>
<root>
	<!--- p2p进程公共资源配置,公共目录由argv[1]指定-->
	<satellite-common>
		<!--- p2p进程日志配置文件-->
		<log-conf>log.cfg</log-conf>
		<!--- 升级进程配置文件-->
		<autoupgrade-conf>autoupgrade.cfg</autoupgrade-conf>
	</satellite-common>
	<satellite-diff>
		<awsIoT4ovfs>
			<!--- 是否启用awsIoT进程下载模式 0-禁止 1-启用 -->
			<download-enable>1</download-enable>
			<!--- awsIoT进程下载的目录,云服务器目录 -->
			<download-p2p-dir>awsIoT4ovfs</download-p2p-dir>
			<!--- awsIoT运行目录 -->
			<p2p-run-dir>/usr/etc</p2p-run-dir>
			<!--- awsIoT进程文件名称 -->
			<p2p-file-name>awsIoT4ovfs</p2p-file-name>
			<!--- awsIoT进程运行产生的配置文件,主要存放在公共资源配置目录,由argv[1]指定 -->
			<p2p-version-file>awsIoT4ovfs_version_info</p2p-version-file>
			<!--- 检测awsIoT进程版本配置文件,从云服务器通过HTTP协议查询 -->
			<check-version-file>checkversion-awsIoT4ovfs.xml</check-version-file>
			<!--- 定期检测awsIoT进程时间(单位:秒) -->
			<check-update-time>7200</check-update-time>
		</awsIoT4ovfs>		
	</satellite-diff>
</root>