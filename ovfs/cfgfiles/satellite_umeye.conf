<?xml version="1.0" encoding="utf-8"?>
<root>
    <!--- p2p进程公共资源配置,公共目录由argv[1]指定-->
    <satellite-common>
        <!--- p2p进程日志配置文件-->
        <log-conf>log.cfg</log-conf>
        <!--- 升级进程配置文件-->
        <autoupgrade-conf>autoupgrade.cfg</autoupgrade-conf>
    </satellite-common>
    <satellite-diff>
        <umeye4ovfs>
            <!--- 是否启用华师大进程下载模式 0-禁止 1-启用 -->
            <download-enable>1</download-enable>
            <!---华师大进程下载的目录,云服务器目录 -->
            <download-p2p-dir>umeye4ovfs</download-p2p-dir>
            <!--- 华师大进程运行目录 -->
            <p2p-run-dir>/usr/etc</p2p-run-dir>
            <!--- 华师大进程文件名称 -->
            <p2p-file-name>umeye4ovfs</p2p-file-name>
            <!---华师大进程运行产生的配置文件,主要存放在公共资源配置目录,由argv[1]指定 -->
            <p2p-version-file>umeye4ovfs_version_info</p2p-version-file>
            <!--- 检测华师大进程版本配置文件,从云服务器通过HTTP协议查询 -->
            <check-version-file>checkversion-umeye4ovfs.xml</check-version-file>
            <!--- 定期检测华师大进程时间(单位:秒) -->
            <check-update-time>7200</check-update-time>
        </umeye4ovfs>
    </satellite-diff>
</root>