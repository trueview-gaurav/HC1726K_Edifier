#==============================#
#== Auto exposure parameters ==#
#==============================#
# ALSO SEE: MPI_setAeAttr
[AE]
#--- Target image brightness ---#
brightness = 6000

#--- AE strategy parameter---#
strategy.mode = 1
strategy.strength = 8

#--- Weight of ROI ---#
roi.luma_weight = 1
roi.awb_weight = 1

#--- Sensor gain range, isp gain range ---#
#sensor_gain_range : [32~15376], isp_gain_range : [32~3200]
sys_gain_range.max = 8192
sys_gain_range.min = 32
sensor_gain_range.max = 8192
sensor_gain_range.min = 32
isp_gain_range.max = 32
isp_gain_range.min = 32

#--- Operation mode, target frame rate, system gain threshold ---#
fps_mode = 0
frame_rate = 30
slow_frame_rate = 30
gain_thr_up = 1024
gain_thr_down = 2048

#--- Speed, tolerance, black delay frame, white delay frame ---#
speed = 160
black_speed_bias = 128
tolerance = 1280
delay.white_delay_frame = 0
delay.black_delay_frame = 7

#--- Anti-flicker, enable, frequency, mode ---#
anti_flicker.enable = 0
anti_flicker.frequency = 60
anti_flicker.luma_delta = 4000

#--- Frame interval between two executions ---#
interval = 2

#--- Manual mode attribute ---#
manual.is_valid = 0
manual.enable.val = 0 ;b0: exp_value, b1: inttime, b2: sensor_gain, b3:isp_gain, b4: sys_gain
manual.exp_value = 928
manual.inttime = 29
manual.isp_gain = 32
manual.sensor_gain = 32
manual.sys_gain = 32

