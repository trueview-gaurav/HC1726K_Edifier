# AUGENTIX HC18xx Initial attribute settings for SC2332 dual sensor
# This '*.ini' file is used to fine tune picture quality.

#==================================#
#== Calibration algorithm enable ==#
#==================================#
# NOTE: if single sensor, only CAL0 valid
# ALSO SEE: MPI_setCalAttr

[CAL0]
cal_en = 1
dbc_en = 1
dcc_en = 1
lsc_en = 0

[CAL1]
cal_en = 1
dbc_en = 1
dcc_en = 1
lsc_en = 0

#==============================================#
#== Device black-level correction parameters ==#
#==============================================#
# NOTE: if single sensor, only DBC0 valid
# ALSO SEE: MPI_setDbcAttr
[DBC0]
mode = 2
dbc_level = 1050

[DBC1]
mode = 2
dbc_level = 1050

#========================================#
#== Device color correction parameters ==#
#========================================#
# NOTE: if single sensor, only DCC0 valid
# ALSO SEE: MPI_setDccAttr
[DCC0]
gain[0] = 1050
gain[1] = 1685
gain[2] = 1495
gain[3] = 1050
offset_2s[0] = 0
offset_2s[1] = 0
offset_2s[2] = 0
offset_2s[3] = 0

[DCC1]
gain[0] = 1050
gain[1] = 1685
gain[2] = 1495
gain[3] = 1050
offset_2s[0] = 0
offset_2s[1] = 0
offset_2s[2] = 0
offset_2s[3] = 0

#========================================#
#== Lens shading correction parameters ==#
#========================================#
# NOTE: if single sensor, only LSC0 valid
# ALSO SEE: MPI_setLscAttr
[LSC0]
origin = 4
x_trend_2s = 3872
y_trend_2s = 2401
x_curvature = 7290
y_curvature = 7767
tilt_2s = 0

[LSC1]
origin = 4
x_trend_2s = 3872
y_trend_2s = 2401
x_curvature = 7290
y_curvature = 7767
tilt_2s = 0

#===============================================#
#== Digital Image Processing algorithm enable ==#
#===============================================#
# ALSO SEE: MPI_setDipAttr
