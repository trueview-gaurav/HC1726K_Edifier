#==============================#
#== Region Of Interest parameters ==#
#==============================#
# ALSO SEE: MPI_setRoiAttr
[ROI0]
luma_roi.sx = 0
luma_roi.sy = 0
luma_roi.ex = 1024
luma_roi.ey = 1024
awb_roi.sx = 0
awb_roi.sy = 0
awb_roi.ex = 1024
awb_roi.ey = 1024

[ROI1]
