# AUGENTIX HC17x3 Initial attribute settings for SC200AI single sensor
# This '*.ini' file is used to fine tune picture quality.

#==================================#
#== Calibration algorithm enable ==#
#==================================#
# NOTE: if single sensor, only CAL0 valid
# ALSO SEE: MPI_setCalAttr

[CAL0]
cal_en = 1
dbc_en = 1
dcc_en = 1
lsc_en = 0

#==============================================#
#== Device black-level correction parameters ==#
#==============================================#
# NOTE: if single sensor, only DBC0 valid
# ALSO SEE: MPI_setDbcAttr
[DBC0]
mode = 2
dbc_level = 4095

#========================================#
#== Device color correction parameters ==#
#========================================#
# NOTE: if single sensor, only DCC0 valid
# ALSO SEE: MPI_setDccAttr
[DCC0]
gain[0] = 1093
gain[1] = 1848
gain[2] = 2833
gain[3] = 1091
offset_2s[0] = 0
offset_2s[1] = 0
offset_2s[2] = 0
offset_2s[3] = 0

#========================================#
#== Lens shading correction parameters ==#
#========================================#
# NOTE: if single sensor, only LSC0 valid
# ALSO SEE: MPI_setLscAttr
[LSC0]
origin = 4
x_trend_2s = 3872
y_trend_2s = 2401
x_curvature = 7290
y_curvature = 7767
tilt_2s = 0

#===============================================#
#== Digital Image Processing algorithm enable ==#
#===============================================#
# ALSO SEE: MPI_setDipAttr
[DIP]
is_dip_en = 1
is_ae_en = 1
is_iso_en = 1
is_awb_en = 1
is_csm_en = 1
is_te_en = 1
is_pta_en = 1
is_nr_en = 1
is_shp_en = 1
is_gamma_en = 1
is_dpc_en = 1
is_dms_en = 1
is_me_en = 1
is_enh_en = 1
is_coring_en = 0

[SAMPLE_SHP_SELECT]
shp_select = 1 ; 0: apply SHP, 1: apply SHP_V2

#===================================#
#== Region Of Interest parameters ==#
#===================================#
# ALSO SEE: MPI_setRoiAttr
[ROI0]
luma_roi.sx = 0
luma_roi.sy = 0
luma_roi.ex = 1024
luma_roi.ey = 1024
awb_roi.sx = 0
awb_roi.sy = 0
awb_roi.ex = 1024
awb_roi.ey = 1024
zone_lum_avg_roi.sx = 0
zone_lum_avg_roi.sy = 0
