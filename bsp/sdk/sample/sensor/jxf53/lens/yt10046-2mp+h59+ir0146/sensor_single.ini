; ==============================
; == Auto exposure parameters ==
; ==============================
; ALSO SEE: MPI_setAeAttr
[AE]
; --- Target image brightness ---
brightness = 7600

; --- AE strategy parameter---
; strategy.mode{0: NORMAL, 1: HI_LIGHT_SUPPRES}
strategy.mode = 1
strategy.strength = 4

; --- Weight of ROI ---
roi.luma_weight = 12
roi.awb_weight = 0
roi.zone_lum_avg_weight = 24

; --- Sensor gain range, isp gain range ---
; sensor_gain_range : [32~15376], isp_gain_range : [32~3200]
sys_gain_range.max = 7936
sys_gain_range.min = 32
sensor_gain_range.max = 496
sensor_gain_range.min = 32
isp_gain_range.max = 512
isp_gain_range.min = 32

; --- Operation mode, target frame rate, system gain threshold ---
; fps_mode{0: VARIABLE, 1: FIXED}
fps_mode = 0
frame_rate = 30
slow_frame_rate = 15
gain_thr_up = 256
gain_thr_down = 512

; --- Speed, tolerance, black delay frame, white delay frame ---
speed = 160
black_speed_bias = 128
tolerance = 800
delay.white_delay_frame = 0
delay.black_delay_frame = 7

; --- Frame interval between two executions ---
interval = 0

; --- Anti-flicker, enable, frequency, mode ---
anti_flicker.enable = 1
anti_flicker.frequency = 60
anti_flicker.luma_delta = 0

; --- Manual mode attribute ---
manual.is_valid = 0
; b0: exp_value, b1: inttime, b2: sensor_gain, b3:isp_gain, b4: sys_gain
manual.enable.val = 18
manual.exp_value = 32000
manual.inttime = 4119
manual.sensor_gain = 32
