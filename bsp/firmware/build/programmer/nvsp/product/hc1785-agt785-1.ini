; [bootconfig]
;     System boot configuration
;     @nvs_type: type of NVS device: nand, emmc, nor

; [partition_*]
;     Partition descriptor
;
;     @nvs_start: partition starting address in NVS device
;     @nvs_size: size of the partition in Bytes
;     @memload: whether the image is loaded to memory by FSBL.
;               don't-care for boot image in partition 0
;     @emmc_area: (eMMC only) 0: user area; 1: boot partition 1; 2: boot partition 2
;               do not specify for other storage devices
;     @pt_label: partition label; used by storage subsystem such as MTD
;     @img_label: Name of image section (e.g. uboot for image in [uboot] section) to be programmed into the partition
;               do not specify for reserved partitions
;
; [image_*]
;     System image descriptor
;
;     @mem_start: if memload = 1, specifies dest. mem. addr. to load the image to
;                 don't-care if memload = 0
;     @prog_mem_start: (programmer only) specify dest. mem. addr. to download the image to
;                       don't-care for boot modes
;     @file_name: name of the image binary

; Default configs; do not remove
[DEFAULT]
nvs_start = 0x00000000
nvs_size  = 0x00000000
emmc_area = 0
memload = 0
boot_idx = 0
verify   = 0
mem_start = 0x00000000
prog_mem_start = 0x00000000
label = unknown

[bootconfig]
nvs_type = nor

; Partition manifest

[partition_0]
nvs_start = 0x00000000
nvs_size  = 0x00020000
pt_label  = boot
img_label = boot

[partition_1]
nvs_start = 0x00020000
nvs_size  = 0x00080000
pt_label  = fip
img_label = fip

[partition_2]
nvs_start = 0x000A0000
nvs_size  = 0x00010000
pt_label  = bootenv
img_label =

[partition_3]
nvs_start = 0x000B0000
nvs_size  = 0x00900000
pt_label  = linux
img_label = linux

[partition_4]
nvs_start = 0x009B0000
nvs_size  = 0x01100000
pt_label  = rootfs_0
img_label = rootfs

[partition_5]
nvs_start = 0x01AB0000
nvs_size  = 0x00400000
pt_label  = usrdata
img_label = usrdata

[partition_6]
nvs_start = 0x01EB0000
nvs_size  = 0x00010000
pt_label  = baremetal
img_label = baremetal

[partition_7]
nvs_start = 0x01EC0000
nvs_size  = 0x00010000
pt_label  = dtb
img_label = dtb

; Image manifest

[boot]
file_name = boot_flash.bin

[fip]
file_name = fip.bin

[linux]
file_name = uImage.bin

[rootfs]
file_name = rootfs.cpio.uboot.bin

[usrdata]
file_name = usrdata.bin

[baremetal]
file_name = baremetal.bin

[dtb]
file_name = hc1785-agt785-1.dtb
