model_name=yamnet
model_path=yamnet.tflite
# inference type: audio classification
inference_type=audio_classify
# engine type: tflite
engine_type=tflite
# input sample rate (Hz) — YAM Net expects 16 kHz waveform
sample_rate=16000
# confidence threshold (0.0–1.0)
# maps to cd_backend sensitivity: threshold = (255 - sensitivity) / 255.0
conf_thresh=0.5
# target class for cry detection
labels=baby_cry
num_classes=1
