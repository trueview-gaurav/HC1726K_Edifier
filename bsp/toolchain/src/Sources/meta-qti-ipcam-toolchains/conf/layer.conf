# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "qti-ipcam-toolchains"
BBFILE_PATTERN_qti-ipcam-toolchains = "^${LAYERDIR}/"
BBFILE_PRIORITY_qti-ipcam-toolchains = "999"

# Layer compatibility (krogoth)
LAYERSERIES_COMPAT_qti-ipcam-toolchains = "krogoth"

