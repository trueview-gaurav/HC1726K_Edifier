require conf/distro/poky.conf
require conf/distro/include/qti-ipcam-toolchain.inc
require conf/distro/include/qti-ipcam-workarounds.inc

DISTRO = "qti-ipcam"
DISTRO_NAME = "QTI-IPCAM"
DISTRO_VERSION = "1.0.0"

# target triplet vendor
TARGET_VENDOR = "-augentix"

# SDK host triplet vendor:
# SDK_VENDOR ?= "-pokysdk"
SDK_VENDOR = "-augentixsdk"

# Derive gnueabi triplet from TARGET_SYS (keep vendor, replace libc suffix)
QTI_IPCAM_GNUEABI_SYS = "${@((d.getVar('TARGET_SYS', True) or '')\
    .replace('uclibceabihf','gnueabihf')\
    .replace('uclibceabi','gnueabi'))}"

# make hash type to both
LINKER_HASH_STYLE = "both"
TARGET_LINK_HASH_STYLE = "-Wl,--hash-style=both"
